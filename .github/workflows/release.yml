name: Release

# Publishes the NuGet package when a version tag (vX.Y.Z) is pushed.
# Requires a repository secret named NUGET_API_KEY (nuget.org push key).
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore DotNetDifferentialEvolution.sln

      - name: Build
        run: dotnet build DotNetDifferentialEvolution.sln --configuration Release --no-restore

      # Safety gate: never publish if the deterministic unit suite is red.
      - name: Unit tests
        run: >-
          dotnet test DotNetDifferentialEvolution.sln
          --configuration Release --no-build
          --filter "Category=Unit"

      - name: Pack
        run: >-
          dotnet pack Src/DotNetDifferentialEvolution/DotNetDifferentialEvolution.csproj
          --configuration Release --no-build
          --output ${{ github.workspace }}/artifacts

      - name: Push to NuGet
        run: >-
          dotnet nuget push "${{ github.workspace }}/artifacts/*.nupkg"
          --api-key ${{ secrets.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
