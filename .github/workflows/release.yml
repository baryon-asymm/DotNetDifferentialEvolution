name: Release

# Publishes a NuGet package and creates a GitHub Release when a version tag is pushed. Two
# packages, two tag families: vX.Y.Z publishes the CPU package (DotNetDifferentialEvolution),
# gpu-vX.Y.Z publishes the GPU package (DotNetDifferentialEvolution.GPU); a tag never publishes
# the other package. Requires a repository secret named NUGET_API_KEY (nuget.org push key).
on:
  push:
    tags:
      - 'v*'
      - 'gpu-v*'

jobs:
  publish-cpu:
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest

    # contents:write is required for the gh CLI to create the GitHub Release.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore DotNetDifferentialEvolution.sln

      - name: Build
        run: dotnet build DotNetDifferentialEvolution.sln --configuration Release --no-restore

      # Safety gate: never publish if the deterministic unit suite is red.
      - name: Unit tests
        run: >-
          dotnet test DotNetDifferentialEvolution.sln
          --configuration Release --no-build
          --filter "Category=Unit"

      - name: Pack
        run: >-
          dotnet pack src/DotNetDifferentialEvolution/DotNetDifferentialEvolution.csproj
          --configuration Release --no-build
          --output ${{ github.workspace }}/artifacts

      - name: Push to NuGet
        run: >-
          dotnet nuget push "${{ github.workspace }}/artifacts/*.nupkg"
          --api-key ${{ secrets.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      # Create the GitHub Release for this tag with auto-generated notes and
      # the package attached. Uses the runner's built-in gh CLI + GITHUB_TOKEN.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          --title "${{ github.ref_name }}"
          --generate-notes
          --verify-tag
          "${{ github.workspace }}"/artifacts/*.nupkg

  publish-gpu:
    if: startsWith(github.ref_name, 'gpu-v')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore DotNetDifferentialEvolution.sln

      - name: Build
        run: dotnet build DotNetDifferentialEvolution.sln --configuration Release --no-restore

      # Safety gate: the GPU package's suite on ILGPU's CPU accelerator (the hosted runner has no
      # GPU, so Category=Gpu is excluded; those checks are run on the owner's machine before the tag).
      - name: GPU tests on the CPU accelerator
        run: >-
          dotnet test tests/DotNetDifferentialEvolution.GPU.Test/DotNetDifferentialEvolution.GPU.Test.csproj
          --configuration Release --no-build
          --filter "Category!=Gpu"

      - name: Pack
        run: >-
          dotnet pack src/DotNetDifferentialEvolution.GPU/DotNetDifferentialEvolution.GPU.csproj
          --configuration Release --no-build
          --output ${{ github.workspace }}/artifacts

      - name: Push to NuGet
        run: >-
          dotnet nuget push "${{ github.workspace }}/artifacts/*.nupkg"
          --api-key ${{ secrets.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          --title "${{ github.ref_name }}"
          --generate-notes
          --verify-tag
          "${{ github.workspace }}"/artifacts/*.nupkg
