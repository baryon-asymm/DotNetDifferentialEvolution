name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # docs/ALGORITHMS.md maps each formula onto the file that implements it. A rename that
      # orphans one of those links leaves the document rendering correctly and claiming something
      # untrue, so the paths are checked rather than trusted. Runs first: it needs no toolchain.
      - name: Documentation references
        run: ./scripts/check-doc-references.sh

      # The release gate's script (release.yml): tag against version, the changelog's section.
      - name: Release gate self-tests
        run: bash .github/scripts/test-check-release.sh

      # The BOOT.md/API.md tree (AGENTS.md) is checked twice: file by file here, by the protocol
      # linter, and against the compiled code by tests/DotNetDifferentialEvolution.Protocol.Tests,
      # which runs in the integration gate below and starts the same linter with --strict.
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Protocol lint
        run: python -X utf8 tools/protocol-lint/protocol_lint.py . --exclude templates

      - name: Protocol linter self-tests
        run: |
          python -X utf8 tools/protocol-lint/test_protocol_lint.py
          python -X utf8 tools/protocol-lint/test_history_guard.py

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore DotNetDifferentialEvolution.sln

      - name: Build
        run: dotnet build DotNetDifferentialEvolution.sln --configuration Release --no-restore

      # Fast gate: the deterministic unit suite must pass quickly on every push/PR.
      - name: Unit tests
        run: >-
          dotnet test DotNetDifferentialEvolution.sln
          --configuration Release --no-build
          --filter "Category=Unit"
          --collect:"XPlat Code Coverage"

      # Broader gate: unit + integration, excluding the long-running (Slow) tests and the GPU
      # tests that need a real device (Category=Gpu): the hosted runners have neither CUDA nor
      # OpenCL. The GPU package's own suite runs here on ILGPU's CPU accelerator.
      - name: Integration tests (excluding slow and GPU)
        run: >-
          dotnet test DotNetDifferentialEvolution.sln
          --configuration Release --no-build
          --filter "Category!=Slow&Category!=Gpu"

      # API gate: package validation only runs on pack, so pack here and throw the result away.
      # Without this the public-surface diff against the last release would first be seen by the
      # release workflow, at tag time, which is far too late to reconsider a break.
      - name: Pack (public API check against the last release)
        run: >-
          dotnet pack src/DotNetDifferentialEvolution/DotNetDifferentialEvolution.csproj
          --configuration Release --no-build
          --output ${{ runner.temp }}/api-check

      # The GPU package packs from the same build, without publishing (GPU ACCEPTANCE.md, R1).
      # No package validation: 1.0.0 replaces every public type of 0.x on purpose.
      - name: Pack the GPU package
        run: >-
          dotnet pack src/DotNetDifferentialEvolution.GPU/DotNetDifferentialEvolution.GPU.csproj
          --configuration Release --no-build
          --output ${{ runner.temp }}/gpu-pack
